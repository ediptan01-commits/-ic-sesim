name: Android APK ve AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android platformunu olustur
        run: flutter create --platforms=android --project-name ic_sesim --org com.teknolojix .
      - name: Bagimliliklar
        run: flutter pub get
      - name: Statik analiz
        run: flutter analyze
      - name: Testler
        run: flutter test
      - name: APK derle
        run: flutter build apk --release
      - name: AAB derle
        run: flutter build appbundle --release
      - name: Derlenen dosyalari kaydet
        uses: actions/upload-artifact@v4
        with:
          name: IcSesim-v0.1-APK-AAB
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
